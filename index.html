<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASA • Savings Tracker</title>
  <style>
    :root {
      --primary: #6B4EFF;
      --accent: #00E5B8;
      --bg: #0F0F1A;
      --card: #1A1A2E;
      --text: #E0E0FF;
      --text-light: #A0A0CC;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
    }

    .container { max-width: 960px; margin: 0 auto; }

    header {
      text-align: center;
      padding: 20px 0 10px;
    }

    .logo {
      font-size: 2.6rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Savings Cart */
    .savings-cart {
      background: linear-gradient(135deg, #1F1F3A, #2A2A4A);
      border-radius: 28px;
      padding: 28px 24px;
      margin-bottom: 32px;
      box-shadow: 0 15px 35px rgba(107, 78, 255, 0.25);
      border: 1px solid rgba(107, 78, 255, 0.3);
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .total-amount {
      font-size: 3.4rem;
      font-weight: 700;
      color: white;
    }

    .as-of {
      font-size: 0.95rem;
      color: var(--text-light);
    }

    .add-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px 32px;
      border-radius: 9999px;
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 auto 30px;
      box-shadow: 0 8px 25px rgba(107, 78, 255, 0.35);
      transition: all 0.3s;
    }

    .add-btn:hover {
      transform: translateY(-3px);
    }

    .record-card {
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 28px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .record-name {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0 24px;
    }

    th, td {
      padding: 14px 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    th {
      color: var(--text-light);
      font-weight: 500;
      font-size: 0.9rem;
    }

    .status {
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .success { background: rgba(0, 229, 184, 0.2); color: #00E5B8; }
    .warning { background: rgba(255, 193, 7, 0.2); color: #FFC107; }
    .pending { background: rgba(107, 78, 255, 0.2); color: var(--primary); }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      background: rgba(255,255,255,0.03);
      padding: 20px;
      border-radius: 16px;
    }

    .summary-label {
      font-size: 0.85rem;
      color: var(--text-light);
    }

    .summary-value {
      font-size: 1.7rem;
      font-weight: 700;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card);
      border-radius: 24px;
      width: 90%;
      max-width: 420px;
      padding: 32px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      color: var(--text-light);
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: #25253F;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .cancel-btn { background: #33334D; color: white; }
    .create-btn { background: var(--primary); color: white; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">ASA</div>
      <p style="color:#A0A0CC; margin-top:4px;">Savings Tracker</p>
    </header>

    <!-- Savings Cart -->
    <div class="savings-cart">
      <div class="cart-header">
        <div>
          <div style="font-size:1.1rem; color:var(--accent); font-weight:600;">TOTAL SAVINGS</div>
          <div class="total-amount" id="totalSaved">₱912</div>
        </div>
        <div style="font-size:2.5rem;">💰</div>
      </div>
      <div class="as-of" id="asOfDate">As of April 27, 2026</div>
    </div>

    <button class="add-btn" onclick="showAddModal()">
      <span style="font-size:1.5rem;">+</span> Add New Record
    </button>

    <div id="recordsContainer"></div>
  </div>

  <!-- Add Modal -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <h2>Add New Savings Record</h2>
      <label>Record Name</label>
      <input type="text" id="recordName" value="Savings Record 4">

      <label>Week 1 Date (MM/DD/YY)</label>
      <input type="text" id="startDate" value="05/01/26">

      <div class="modal-buttons">
        <button class="cancel-btn" onclick="hideAddModal()">Cancel</button>
        <button class="create-btn" onclick="addNewRecord()">Create Record</button>
      </div>
    </div>
  </div>

  <script>
    let records = [];

    function loadData() {
      const saved = localStorage.getItem('asaSavingsRecords');
      if (saved) {
        records = JSON.parse(saved);
      } else {
        // Initial Data
        records = [
          {
            id: 1,
            name: "Savings Record 1",
            startDate: "04/01/26",
            weeks: [
              { week: 1, target: 250, received: 250, status: "success", note: "Received ₱250" },
              { week: 2, target: 250, received: 200, status: "warning", note: "Received ₱200 - Missing ₱50" },
              { week: 3, target: 250, received: 250, status: "success", note: "Received ₱250" },
              { week: 4, target: 250, received: 250, status: "success", note: "Received ₱250" }
            ]
          },
          {
            id: 2,
            name: "Savings Record 2",
            startDate: "04/01/26",
            weeks: [
              { week: 1, target: 250, received: 250, status: "success", note: "Received ₱250" },
              { week: 2, target: 250, received: 250, status: "success", note: "Received ₱250" },
              { week: 3, target: 250, received: 250, status: "success", note: "Received ₱250" },
              { week: 4, target: 250, received: 0, status: "pending", note: "Pending as of 05/04/26" }
            ]
          },
          {
            id: 3,
            name: "Savings Record 3",
            startDate: "05/01/26",
            weeks: [
              { week: 1, target: 250, received: 0, status: "pending", note: "Pending as of 05/11/26" },
              { week: 2, target: 250, received: 0, status: "pending", note: "Pending as of 05/18/26" },
              { week: 3, target: 250, received: 0, status: "pending", note: "Pending as of 05/25/26" },
              { week: 4, target: 250, received: 0, status: "pending", note: "Pending as of 06/01/26" }
            ]
          }
        ];
        saveData();
      }
      renderAllRecords();
    }

    function saveData() {
      localStorage.setItem('asaSavingsRecords', JSON.stringify(records));
    }

    function calculateActual(weeks) {
      return weeks.reduce((sum, w) => sum + (w.received || 0), 0);
    }

    function formatDate(dateStr, weekNum) {
      try {
        const [month, day, year] = dateStr.split('/').map(Number);
        const date = new Date(2000 + year, month - 1, day);
        date.setDate(date.getDate() + (weekNum - 1) * 7);
        return date.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: '2-digit' });
      } catch (e) {
        return dateStr;
      }
    }

    function getStatusHTML(status) {
      if (status === "success") return `<span class="status success">✅ Received</span>`;
      if (status === "warning") return `<span class="status warning">⚠️ Partial</span>`;
      return `<span class="status pending">⏳ Pending</span>`;
    }

    function renderRecord(record) {
      const actual = calculateActual(record.weeks);
      let html = `
        <div class="record-card">
          <div class="record-name">${record.name}</div>
          <table>
            <tr>
              <th>Week</th>
              <th>Date</th>
              <th>Target</th>
              <th>Received</th>
              <th>Status</th>
            </tr>`;

      record.weeks.forEach(week => {
        const date = formatDate(record.startDate, week.week);
        html += `
          <tr>
            <td><strong>Week ${week.week}</strong></td>
            <td>${date}</td>
            <td>₱${week.target}</td>
            <td>₱${week.received}</td>
            <td>${getStatusHTML(week.status)}</td>
          </tr>`;
      });

      html += `</table>
        <div class="summary">
          <div>
            <div class="summary-label">EXPECTED</div>
            <div class="summary-value">₱1,000</div>
          </div>
          <div>
            <div class="summary-label">ACTUAL SAVED</div>
            <div class="summary-value" style="color: ${actual >= 1000 ? '#00E5B8' : 'white'}">₱${actual}</div>
          </div>
        </div>
      </div>`;
      return html;
    }

    function renderAllRecords() {
      const container = document.getElementById('recordsContainer');
      let html = '';
      records.forEach(record => {
        html += renderRecord(record);
      });
      container.innerHTML = html;

      const total = records.reduce((sum, r) => sum + calculateActual(r.weeks), 0);
      document.getElementById('totalSaved').textContent = `₱${total}`;
    }

    function showAddModal() {
      document.getElementById('addModal').style.display = 'flex';
      const nextNum = records.length + 1;
      document.getElementById('recordName').value = `Savings Record ${nextNum}`;
    }

    function hideAddModal() {
      document.getElementById('addModal').style.display = 'none';
    }

    function addNewRecord() {
      const name = document.getElementById('recordName').value.trim() || `Savings Record ${records.length + 1}`;
      let startDate = document.getElementById('startDate').value.trim() || "05/01/26";

      const newRecord = {
        id: Date.now(),
        name: name,
        startDate: startDate,
        weeks: Array.from({length: 4}, (_, i) => ({
          week: i + 1,
          target: 250,
          received: 0,
          status: "pending",
          note: "Pending"
        }))
      };

      records.push(newRecord);
      saveData();
      renderAllRecords();
      hideAddModal();
    }

    // Initialize the app
    window.onload = loadData;
  </script>
</body>
</html>
